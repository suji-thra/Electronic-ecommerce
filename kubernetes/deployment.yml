apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommerce-deployment
  namespace: ecommerce

spec:

  replicas: 3

  selector:
    matchLabels:
      app: ecommerce

  template:

    metadata:
      labels:
        app: ecommerce

    spec:

      containers:

      - name: ecommerce

        image: suji120/ecommerce-app:latest

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 5
          periodSeconds: 5
