<!DOCTYPE html>
<html>
<head>
    <title>DevOps E-Commerce</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .product {
            background: white;
            padding: 25px;
            width: 200px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>DevOps E-Commerce Store</h1>
    <p>Docker + Jenkins + Kubernetes</p>
</header>

<div class="products">

    <div class="product">
        <h2>Laptop</h2>
        <p>₹50,000</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <h2>Mobile</h2>
        <p>₹25,000</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <h2>Headphones</h2>
        <p>₹5,000</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
